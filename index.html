<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Avanzado de Diodos de Potencia | EIE430</title>
    <style>
        :root {
            --bg-color: #0a0c10;
            --panel-bg: #12161f;
            --border-color: #1e2638;
            --accent-green: #00ff88;
            --accent-pink: #ff0055;
            --accent-yellow: #ffd000;
            --accent-blue: #00d0ff;
            --text-main: #e0e6ed;
            --text-muted: #7e8b9b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 18px;
            background: var(--accent-green);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--accent-green);
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            width: 100%;
            max-width: 1000px;
        }

        .tab-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 1000px;
        }

        .canvas-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 520px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            padding: 16px 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-value {
            color: var(--accent-blue);
            font-family: 'SF Mono', Consolas, Monaco, monospace;
        }

        input[type=range], select {
            width: 100%;
            background: #1c2333;
            height: 6px;
            border-radius: 3px;
            outline: none;
            border: none;
        }

        select {
            height: 32px;
            background: #1c2333;
            color: var(--text-main);
            padding: 0 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-main);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .button-bar {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .btn {
            flex: 1;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #161b26;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            background: #202738;
            border-color: #33415c;
        }

        .btn-active {
            background: rgba(255, 0, 85, 0.15);
            border-color: var(--accent-pink);
            color: var(--accent-pink);
        }
    </style>
</head>
<body>

    <header>
        <h1>SIMULADOR DE DISPOSITIVOS SEMICONDUCTORES DE POTENCIA</h1>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" id="tabRect">1. Rectificador y Estática ($V_F$)</button>
        <button class="tab-btn" id="tabDynamic">2. Dinámica ($t_{rr}$) y Ruptura ($v_{IB}$)</button>
    </div>

    <div class="container">
        <div class="canvas-card">
            <canvas id="simCanvas" width="1000" height="520"></canvas>
        </div>

        <!-- CONTROLES MODO 1 -->
        <div class="controls-grid" id="controlsRect">
            <div class="control-group">
                <div class="control-header"><span>Tensión Pico ($V_p$)</span><span class="control-value" id="valVp">12.0 V</span></div>
                <input type="range" id="paramVp" min="1" max="30" step="0.5" value="12">
            </div>
            <div class="control-group">
                <div class="control-header"><span>Frecuencia ($f$)</span><span class="control-value" id="valFreq">1.00 Hz</span></div>
                <input type="range" id="paramFreq" min="0.2" max="3" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <div class="control-header"><span>Caída Directa ($V_F$)</span><span class="control-value" id="valVf">0.70 V</span></div>
                <input type="range" id="paramVf" min="0.0" max="2.0" step="0.05" value="0.7">
            </div>
            <div class="control-group">
                <div class="control-header"><span>Resistencia ($R_L$)</span><span class="control-value" id="valR">10.0 Ω</span></div>
                <input type="range" id="paramR" min="2" max="50" step="1" value="10">
            </div>
            <div class="control-group">
                <div class="control-header"><span>Velocidad</span><span class="control-value" id="valSpeed">0.50x</span></div>
                <input type="range" id="paramSpeed" min="0.1" max="2.0" step="0.05" value="0.5">
            </div>
            <div class="control-group button-bar">
                <button class="btn" id="btnPause">Pausar</button>
                <button class="btn" id="btnReset">Reiniciar</button>
            </div>
        </div>

        <!-- CONTROLES MODO 2 -->
        <div class="controls-grid" id="controlsDynamic" style="display: none;">
            <div class="control-group">
                <div class="control-header"><span>Tipo de Diodo</span></div>
                <select id="paramDiodeType">
                    <option value="gen">Uso General (Línea)[cite: 1]</option>
                    <option value="fast">Recuperación Rápida (Fast Recovery)[cite: 1]</option>
                </select>
            </div>
            <div class="control-group">
                <div class="control-header"><span>Tensión Ruptura ($v_{IB}$)</span><span class="control-value" id="valVib">-15.0 V</span></div>
                <input type="range" id="paramVib" min="-25" max="-5" step="1" value="-15">
            </div>
            <div class="control-group">
                <div class="control-header"><span>Tasa $di_F/dt$</span><span class="control-value" id="valDidt">Medio</span></div>
                <input type="range" id="paramDidt" min="1" max="3" step="1" value="2">
            </div>
            <div class="control-group button-bar">
                <button class="btn" id="btnTriggerTrr">Disparar Transitorio $t_{rr}$</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let currentMode = 'rect'; // 'rect' o 'dynamic'

        document.getElementById('tabRect').addEventListener('click', () => {
            currentMode = 'rect';
            document.getElementById('tabRect').classList.add('active');
            document.getElementById('tabDynamic').classList.remove('active');
            document.getElementById('controlsRect').style.display = 'grid';
            document.getElementById('controlsDynamic').style.display = 'none';
        });

        document.getElementById('tabDynamic').addEventListener('click', () => {
            currentMode = 'dynamic';
            document.getElementById('tabDynamic').classList.add('active');
            document.getElementById('tabRect').classList.remove('active');
            document.getElementById('controlsDynamic').style.display = 'grid';
            document.getElementById('controlsRect').style.display = 'none';
        });

        // Controles Modo 1
        const inVp = document.getElementById('paramVp');
        const inFreq = document.getElementById('paramFreq');
        const inVf = document.getElementById('paramVf');
        const inR = document.getElementById('paramR');
        const inSpeed = document.getElementById('paramSpeed');
        const btnPause = document.getElementById('btnPause');
        const btnReset = document.getElementById('btnReset');

        let time = 0;
        let lastTimestamp = 0;
        let isPaused = false;
        const waveHistoryMax = 400;
        let vinHistory = [], voutHistory = [];

        btnPause.addEventListener('click', () => {
            isPaused = !isPaused;
            btnPause.innerText = isPaused ? "Reanudar" : "Pausar";
            btnPause.classList.toggle('btn-active', isPaused);
        });
        btnReset.addEventListener('click', () => { time = 0; vinHistory = []; voutHistory = []; });

        // Geometría Modo 1
        const loopNodes = [{x: 220, y: 460}, {x: 220, y: 340}, {x: 460, y: 340}, {x: 540, y: 340}, {x: 780, y: 340}, {x: 780, y: 460}, {x: 220, y: 460}];
        let totalLength = 0;
        const segments = [];
        for (let i = 0; i < loopNodes.length - 1; i++) {
            const dx = loopNodes[i+1].x - loopNodes[i].x, dy = loopNodes[i+1].y - loopNodes[i].y;
            const len = Math.hypot(dx, dy);
            segments.push({ p1: loopNodes[i], p2: loopNodes[i+1], len: len });
            totalLength += len;
        }
        const particles = Array.from({length: 28}, (_, i) => i / 28);

        function getLoopPosition(normT) {
            let targetDist = (normT % 1.0) * totalLength;
            let accum = 0;
            for (let seg of segments) {
                if (accum + seg.len >= targetDist) {
                    let r = (targetDist - accum) / seg.len;
                    return { x: seg.p1.x + r * (seg.p2.x - seg.p1.x), y: seg.p1.y + r * (seg.p2.y - seg.p1.y) };
                }
                accum += seg.len;
            }
            return loopNodes[0];
        }

        // Estado Modo 2 (Trr y Ruptura)
        const inDiodeType = document.getElementById('paramDiodeType');
        const inVib = document.getElementById('paramVib');
        const btnTriggerTrr = document.getElementById('btnTriggerTrr');
        let trrAnimTimer = 1.0;

        btnTriggerTrr.addEventListener('click', () => { trrAnimTimer = 0.0; });

        function render(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const dtRaw = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
            lastTimestamp = timestamp;

            ctx.fillStyle = "#0c0f17";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (currentMode === 'rect') {
                // --- MODO 1: RECTIFICADOR Y ESTÁTICA ---
                const Vp = parseFloat(inVp.value), freq = parseFloat(inFreq.value), Vf = parseFloat(inVf.value), R = parseFloat(inR.value), speed = parseFloat(inSpeed.value);
                document.getElementById('valVp').innerText = `${Vp.toFixed(1)} V`;
                document.getElementById('valFreq').innerText = `${freq.toFixed(2)} Hz`;
                document.getElementById('valVf').innerText = `${Vf.toFixed(2)} V`;
                document.getElementById('valR').innerText = `${R.toFixed(1)} Ω`;
                document.getElementById('valSpeed').innerText = `${speed.toFixed(2)}x`;

                const dt = isPaused ? 0 : dtRaw * speed;
                time += dt;
                const vin = Vp * Math.sin(2 * Math.PI * freq * time);
                let vout = 0, current = 0, isConduction = false;

                if (vin > Vf) {
                    vout = vin - Vf;
                    current = vout / R;
                    isConduction = true;
                }

                if (!isPaused) {
                    vinHistory.push(vin); voutHistory.push(vout);
                    if (vinHistory.length > waveHistoryMax) { vinHistory.shift(); voutHistory.shift(); }
                }

                // Osciloscopio
                const oscRect = { x: 30, y: 20, w: 940, h: 200 };
                ctx.fillStyle = "#10141f"; ctx.fillRect(oscRect.x, oscRect.y, oscRect.w, oscRect.h);
                ctx.strokeStyle = "#1b2333"; ctx.lineWidth = 1; ctx.beginPath();
                for (let x = oscRect.x; x <= oscRect.x + oscRect.w; x += 47) { ctx.moveTo(x, oscRect.y); ctx.lineTo(x, oscRect.y + oscRect.h); }
                for (let y = oscRect.y; y <= oscRect.y + oscRect.h; y += 25) { ctx.moveTo(oscRect.x, y); ctx.lineTo(oscRect.x + oscRect.w, y); }
                ctx.stroke();

                const midY = oscRect.y + oscRect.h / 2;
                ctx.strokeStyle = "#2c3b59"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(oscRect.x, midY); ctx.lineTo(oscRect.x + oscRect.w, midY); ctx.stroke();

                const vScale = 2.8, dx = oscRect.w / waveHistoryMax;
                ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 2; ctx.beginPath();
                for (let i = 0; i < vinHistory.length; i++) {
                    const px = oscRect.x + i * dx, py = midY - vinHistory[i] * vScale;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.stroke();

                ctx.strokeStyle = "#ff0055"; ctx.lineWidth = 2.5; ctx.beginPath();
                for (let i = 0; i < voutHistory.length; i++) {
                    const px = oscRect.x + i * dx, py = midY - voutHistory[i] * vScale;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.stroke();

                ctx.font = "600 13px 'SF Mono', monospace";
                ctx.fillStyle = "#00ff88"; ctx.fillText(`Vin: ${(vin >= 0 ? "+" : "") + vin.toFixed(2)} V`, oscRect.x + 20, oscRect.y + 26);
                ctx.fillStyle = "#ff0055"; ctx.fillText(`Vout: ${(vout >= 0 ? "+" : "") + vout.toFixed(2)} V`, oscRect.x + 180, oscRect.y + 26);
                ctx.fillStyle = "#ffd000"; ctx.fillText(`Id: ${current.toFixed(2)} A`, oscRect.x + 340, oscRect.y + 26);

                // Circuito Esquema
                ctx.strokeStyle = "#2a364f"; ctx.lineWidth = 4; ctx.beginPath();
                ctx.moveTo(loopNodes[0].x, loopNodes[0].y);
                for (let i = 1; i < loopNodes.length; i++) ctx.lineTo(loopNodes[i].x, loopNodes[i].y);
                ctx.stroke();

                const srcPos = { x: 220, y: 400 };
                ctx.fillStyle = "#0c0f17"; ctx.beginPath(); ctx.arc(srcPos.x, srcPos.y, 24, 0, 2 * Math.PI); ctx.fill();
                ctx.strokeStyle = "#5a6e8c"; ctx.lineWidth = 2; ctx.stroke();
                ctx.font = "bold 18px sans-serif"; ctx.fillStyle = "#ffffff"; ctx.textAlign = "center"; ctx.fillText("~", srcPos.x, srcPos.y + 6);

                const dCenter = { x: 500, y: 340 };
                ctx.fillStyle = "#0c0f17"; ctx.fillRect(dCenter.x - 30, dCenter.y - 25, 60, 50);
                const diodeColor = isConduction ? "#00ff88" : "#ff0055";
                ctx.fillStyle = diodeColor; ctx.strokeStyle = diodeColor;
                ctx.beginPath(); ctx.moveTo(dCenter.x - 14, dCenter.y - 14); ctx.lineTo(dCenter.x - 14, dCenter.y + 14); ctx.lineTo(dCenter.x + 14, dCenter.y); ctx.closePath(); ctx.fill();
                ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(dCenter.x + 14, dCenter.y - 15); ctx.lineTo(dCenter.x + 14, dCenter.y + 15); ctx.stroke();
                ctx.font = "600 12px 'SF Mono', monospace"; ctx.fillStyle = diodeColor; ctx.fillText(isConduction ? "ON (CONDUCCIÓN)" : "OFF (BLOQUEO)", dCenter.x, dCenter.y - 28);

                const rPos = { x: 780, y: 400 };
                ctx.fillStyle = "#0c0f17"; ctx.fillRect(rPos.x - 20, rPos.y - 35, 40, 70);
                ctx.strokeStyle = "#00d0ff"; ctx.lineWidth = 2.5; ctx.strokeRect(rPos.x - 12, rPos.y - 28, 24, 56);
                ctx.font = "12px 'SF Mono', monospace"; ctx.fillStyle = "#00d0ff"; ctx.textAlign = "left"; ctx.fillText(`RL = ${R.toFixed(0)}Ω`, rPos.x + 22, rPos.y + 4);

                const particleSpeed = isConduction ? (current / (Vp / R)) * 0.45 : 0;
                for (let i = 0; i < particles.length; i++) {
                    if (isConduction && !isPaused) particles[i] = (particles[i] + particleSpeed * dt) % 1.0;
                    const pos = getLoopPosition(particles[i]);
                    ctx.fillStyle = isConduction ? "#ffd000" : "#4a5568";
                    ctx.beginPath(); ctx.arc(pos.x, pos.y, isConduction ? 3.5 : 2, 0, 2 * Math.PI); ctx.fill();
                }

            } else {
                // --- MODO 2: DINÁMICA (trr) Y RUPTURA (vIB) ---
                trrAnimTimer += dtRaw * 0.8;
                if (trrAnimTimer > 2.0) trrAnimTimer = 0.0; // Loop de animación del transitorio

                const isFast = inDiodeType.value === 'fast';
                const Vib = parseFloat(inVib.value);
                document.getElementById('valVib').innerText = `${Vib.toFixed(1)} V`;

                // Títulos e información didáctica en pantalla
                ctx.font = "bold 16px sans-serif";
                ctx.fillStyle = "#ffffff";
                ctx.fillText("ANÁLISIS DINÁMICO: RECUPERACIÓN INVERSa ($t_{rr}$) Y ZONA DE RUPTURA ($v_{IB}$)", 40, 40);[cite: 1]

                // Gráfica de Trr (basada en la Diapositiva 6 del PDF)[cite: 1]
                const graphX = 60, graphY = 80, graphW = 880, graphH = 220;
                ctx.fillStyle = "#10141f"; ctx.fillRect(graphX, graphY, graphW, graphH);
                ctx.strokeStyle = "#1b2333"; ctx.strokeRect(graphX, graphY, graphW, graphH);

                const zeroY = graphY + 140;
                ctx.strokeStyle = "#2c3b59"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(graphX, zeroY); ctx.lineTo(graphX + graphW, zeroY); ctx.stroke();

                // Dibujar forma de onda de corriente trr
                ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 3; ctx.beginPath();
                let trrDuration = isFast ? 40 : 120; // El diodo fast recovery tiene trr mucho menor
                let peakIRRM = isFast ? 15 : 45;

                for (let x = 0; x < graphW; x++) {
                    let localT = x - 200;
                    let iVal = 60; // Corriente directa IF
                    if (localT > 0) {
                        // Transitorio de apagado
                        let progress = localT / trrDuration;
                        if (progress <= 1.0) {
                            iVal = 60 - progress * (60 + peakIRRM);
                        } else if (progress <= 2.5) {
                            let recProgress = (progress - 1.0) / 1.5;
                            iVal = -peakIRRM * (1 - recProgress);
                        } else {
                            iVal = 0;
                        }
                    }
                    let py = zeroY - iVal * 1.5;
                    if (x === 0) ctx.moveTo(graphX + x, py); else ctx.lineTo(graphX + x, py);
                }
                ctx.stroke();

                // Anotaciones técnicas en pantalla
                ctx.font = "12px 'SF Mono', monospace";
                ctx.fillStyle = "#ffd000";
                ctx.fillText(`Tecnología: ${isFast ? "Fast Recovery Diode (Menor Qrr, t_rr rápido)" : "Uso General / Línea (Alto t_rr, mayor pérdidas)"}`, graphX + 20, graphY + 30);[cite: 1]
                ctx.fillStyle = "#ff0055";
                ctx.fillText(`Pico Inverso I_RRM y Carga Q_rr = Q_s + Q_f`, graphX + 20, graphY + 55);[cite: 1]

                // Panel inferior: Explicación de Ruptura (Diapositiva 5)[cite: 1]
                const breakY = 330;
                ctx.fillStyle = "#12161f"; ctx.fillRect(graphX, breakY, graphW, 150);
                ctx.strokeStyle = "#1e2638"; ctx.strokeRect(graphX, breakY, graphW, 150);

                ctx.font = "bold 14px sans-serif"; ctx.fillStyle = "#00d0ff";
                ctx.fillText("Comportamiento en Región de Bloqueo y Tensión de Ruptura ($v_{IB}$)", graphX + 20, breakY + 30);[cite: 1]

                ctx.font = "13px sans-serif"; ctx.fillStyle = "#e0e6ed";
                ctx.fillText(`• Umbral de Bloqueo Configurado: v_IB = ${Vib} V`, graphX + 20, breakY + 65);[cite: 1]
                ctx.fillText(`• Si la tensión inversa supera este límite, el diodo entra en conducción por avalancha (Breakdown).`, graphX + 20, breakY + 95);[cite: 1]
                ctx.fillStyle = "#00ff88";
                ctx.fillText(`Estado actual del Bloqueo: SEGURO (Operando por debajo de v_IB)`, graphX + 20, breakY + 125);[cite: 1]
            }

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
