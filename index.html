<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Diodo de Potencia | Electrónica de Potencia</title>
    <style>
        :root {
            --bg-color: #0a0c10;
            --panel-bg: #12161f;
            --border-color: #1e2638;
            --accent-green: #00ff88;
            --accent-pink: #ff0055;
            --accent-yellow: #ffd000;
            --accent-blue: #00d0ff;
            --text-main: #e0e6ed;
            --text-muted: #7e8b9b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 18px;
            background: var(--accent-green);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--accent-green);
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 1000px;
        }

        .canvas-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        canvas {
            display: block;
            width: 100%;
            height: 520px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            padding: 16px 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-value {
            color: var(--accent-blue);
            font-family: 'SF Mono', Consolas, Monaco, monospace;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: #1c2333;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-main);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #ffffff;
        }

        .button-bar {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .btn {
            flex: 1;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #161b26;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            background: #202738;
            border-color: #33415c;
        }

        .btn-active {
            background: rgba(255, 0, 85, 0.15);
            border-color: var(--accent-pink);
            color: var(--accent-pink);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>RECTIFICADOR DE MEDIA ONDA · DIODO DE POTENCIA</h1>
    </header>

    <div class="container">
        <div class="canvas-card">
            <canvas id="simCanvas" width="1000" height="520"></canvas>
        </div>

        <div class="controls-grid">
            <div class="control-group">
                <div class="control-header">
                    <span>Tensión Pico ($V_p$)</span>
                    <span class="control-value" id="valVp">12.0 V</span>
                </div>
                <input type="range" id="paramVp" min="1" max="30" step="0.5" value="12">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span>Frecuencia ($f$)</span>
                    <span class="control-value" id="valFreq">1.00 Hz</span>
                </div>
                <input type="range" id="paramFreq" min="0.2" max="3" step="0.1" value="1.0">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span>Caída Directa ($V_F$)</span>
                    <span class="control-value" id="valVf">0.70 V</span>
                </div>
                <input type="range" id="paramVf" min="0.0" max="2.0" step="0.05" value="0.7">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span>Resistencia ($R_L$)</span>
                    <span class="control-value" id="valR">10.0 Ω</span>
                </div>
                <input type="range" id="paramR" min="2" max="50" step="1" value="10">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span>Velocidad Simulación</span>
                    <span class="control-value" id="valSpeed">0.50x</span>
                </div>
                <input type="range" id="paramSpeed" min="0.1" max="2.0" step="0.05" value="0.5">
            </div>

            <div class="control-group button-bar">
                <button class="btn" id="btnPause">Pausar</button>
                <button class="btn" id="btnReset">Reiniciar</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Controles de entrada
        const inVp = document.getElementById('paramVp');
        const inFreq = document.getElementById('paramFreq');
        const inVf = document.getElementById('paramVf');
        const inR = document.getElementById('paramR');
        const inSpeed = document.getElementById('paramSpeed');

        const valVp = document.getElementById('valVp');
        const valFreq = document.getElementById('valFreq');
        const valVf = document.getElementById('valVf');
        const valR = document.getElementById('valR');
        const valSpeed = document.getElementById('valSpeed');

        const btnPause = document.getElementById('btnPause');
        const btnReset = document.getElementById('btnReset');

        // Estado del circuito y buffers
        let time = 0;
        let lastTimestamp = 0;
        let isPaused = false;
        const waveHistoryMax = 400;
        let vinHistory = [];
        let voutHistory = [];

        // Botones de acción
        btnPause.addEventListener('click', () => {
            isPaused = !isPaused;
            btnPause.innerText = isPaused ? "Reanudar" : "Pausar";
            btnPause.classList.toggle('btn-active', isPaused);
        });

        btnReset.addEventListener('click', () => {
            time = 0;
            vinHistory = [];
            voutHistory = [];
        });

        // Geometría del circuito
        const loopNodes = [
            {x: 220, y: 460}, // Retorno inferior
            {x: 220, y: 340}, // Fuente AC
            {x: 460, y: 340}, // Ánodo diodo
            {x: 540, y: 340}, // Cátodo diodo
            {x: 780, y: 340}, // Carga superior
            {x: 780, y: 460}, // Carga inferior
            {x: 220, y: 460}  // Cierre
        ];

        let totalLength = 0;
        const segments = [];
        for (let i = 0; i < loopNodes.length - 1; i++) {
            const dx = loopNodes[i+1].x - loopNodes[i].x;
            const dy = loopNodes[i+1].y - loopNodes[i].y;
            const len = Math.hypot(dx, dy);
            segments.push({ p1: loopNodes[i], p2: loopNodes[i+1], len: len });
            totalLength += len;
        }

        // Partículas de corriente
        const numParticles = 28;
        const particles = Array.from({length: numParticles}, (_, i) => i / numParticles);

        function getLoopPosition(normT) {
            let targetDist = (normT % 1.0) * totalLength;
            if (targetDist < 0) targetDist += totalLength;
            let accum = 0;
            for (let seg of segments) {
                if (accum + seg.len >= targetDist) {
                    let r = (targetDist - accum) / seg.len;
                    return {
                        x: seg.p1.x + r * (seg.p2.x - seg.p1.x),
                        y: seg.p1.y + r * (seg.p2.y - seg.p1.y)
                    };
                }
                accum += seg.len;
            }
            return loopNodes[0];
        }

        function render(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const dtRaw = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
            lastTimestamp = timestamp;

            const Vp = parseFloat(inVp.value);
            const freq = parseFloat(inFreq.value);
            const Vf = parseFloat(inVf.value);
            const R = parseFloat(inR.value);
            const speed = parseFloat(inSpeed.value);

            valVp.innerText = `${Vp.toFixed(1)} V`;
            valFreq.innerText = `${freq.toFixed(2)} Hz`;
            valVf.innerText = `${Vf.toFixed(2)} V`;
            valR.innerText = `${R.toFixed(1)} Ω`;
            valSpeed.innerText = `${speed.toFixed(2)}x`;

            const dt = isPaused ? 0 : dtRaw * speed;
            time += dt;

            // Modelo matemático instantáneo
            const vin = Vp * Math.sin(2 * Math.PI * freq * time);
            let vout = 0;
            let current = 0;
            let isConduction = false;

            if (vin > Vf) {
                vout = vin - Vf;
                current = vout / R;
                isConduction = true;
            }

            if (!isPaused) {
                vinHistory.push(vin);
                voutHistory.push(vout);
                if (vinHistory.length > waveHistoryMax) {
                    vinHistory.shift();
                    voutHistory.shift();
                }
            }

            // Limpieza de Canvas
            ctx.fillStyle = "#0c0f17";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // ==========================================
            // 1. PANEL OSCILOSCOPIO
            // ==========================================
            const oscRect = { x: 30, y: 20, w: 940, h: 200 };
            ctx.fillStyle = "#10141f";
            ctx.fillRect(oscRect.x, oscRect.y, oscRect.w, oscRect.h);

            // Grilla
            ctx.strokeStyle = "#1b2333";
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = oscRect.x; x <= oscRect.x + oscRect.w; x += 47) {
                ctx.moveTo(x, oscRect.y); ctx.lineTo(x, oscRect.y + oscRect.h);
            }
            for (let y = oscRect.y; y <= oscRect.y + oscRect.h; y += 25) {
                ctx.moveTo(oscRect.x, y); ctx.lineTo(oscRect.x + oscRect.w, y);
            }
            ctx.stroke();

            // Eje central 0V
            const midY = oscRect.y + oscRect.h / 2;
            ctx.strokeStyle = "#2c3b59";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(oscRect.x, midY);
            ctx.lineTo(oscRect.x + oscRect.w, midY);
            ctx.stroke();

            // Trazado de señales con resplandor
            const vScale = 2.8; // Escala vertical (px/V)
            const dx = oscRect.w / waveHistoryMax;

            // Curva Vin (Verde)
            ctx.save();
            ctx.strokeStyle = "#00ff88";
            ctx.shadowColor = "#00ff88";
            ctx.shadowBlur = 8;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < vinHistory.length; i++) {
                const px = oscRect.x + i * dx;
                const py = midY - vinHistory[i] * vScale;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.restore();

            // Curva Vout (Magenta)
            ctx.save();
            ctx.strokeStyle = "#ff0055";
            ctx.shadowColor = "#ff0055";
            ctx.shadowBlur = 10;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (let i = 0; i < voutHistory.length; i++) {
                const px = oscRect.x + i * dx;
                const py = midY - voutHistory[i] * vScale;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.restore();

            // Lecturas numéricas en el osciloscopio
            ctx.font = "600 13px 'SF Mono', Consolas, monospace";
            ctx.fillStyle = "#00ff88";
            ctx.fillText(`Vin:  ${(vin >= 0 ? "+" : "") + vin.toFixed(2)} V`, oscRect.x + 20, oscRect.y + 26);
            ctx.fillStyle = "#ff0055";
            ctx.fillText(`Vout: ${(vout >= 0 ? "+" : "") + vout.toFixed(2)} V`, oscRect.x + 180, oscRect.y + 26);
            ctx.fillStyle = "#ffd000";
            ctx.fillText(`Id:   ${current.toFixed(2)} A`, oscRect.x + 340, oscRect.y + 26);

            // ==========================================
            // 2. PANEL ESQUEMÁTICO
            // ==========================================
            ctx.strokeStyle = "#2a364f";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(loopNodes[0].x, loopNodes[0].y);
            for (let i = 1; i < loopNodes.length; i++) {
                ctx.lineTo(loopNodes[i].x, loopNodes[i].y);
            }
            ctx.stroke();

            // Fuente AC (220, 400)
            const srcPos = { x: 220, y: 400 };
            ctx.fillStyle = "#0c0f17";
            ctx.beginPath();
            ctx.arc(srcPos.x, srcPos.y, 24, 0, 2 * Math.PI);
            ctx.fill();
            ctx.strokeStyle = "#5a6e8c";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.font = "bold 18px sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.fillText("~", srcPos.x, srcPos.y + 6);
            ctx.font = "11px 'SF Mono', monospace";
            ctx.fillStyle = "#7e8b9b";
            ctx.fillText("AC SRC", srcPos.x - 40, srcPos.y + 4);

            // Diodo de Potencia (500, 340)
            const dCenter = { x: 500, y: 340 };
            ctx.fillStyle = "#0c0f17";
            ctx.fillRect(dCenter.x - 30, dCenter.y - 25, 60, 50);

            const diodeColor = isConduction ? "#00ff88" : "#ff0055";
            ctx.save();
            ctx.fillStyle = diodeColor;
            ctx.strokeStyle = diodeColor;
            ctx.shadowColor = diodeColor;
            ctx.shadowBlur = isConduction ? 12 : 4;
            
            // Triángulo Ánodo
            ctx.beginPath();
            ctx.moveTo(dCenter.x - 14, dCenter.y - 14);
            ctx.lineTo(dCenter.x - 14, dCenter.y + 14);
            ctx.lineTo(dCenter.x + 14, dCenter.y);
            ctx.closePath();
            ctx.fill();

            // Cátodo
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(dCenter.x + 14, dCenter.y - 15);
            ctx.lineTo(dCenter.x + 14, dCenter.y + 15);
            ctx.stroke();
            ctx.restore();

            // Etiqueta de estado del diodo
            ctx.font = "600 12px 'SF Mono', monospace";
            ctx.fillStyle = diodeColor;
            ctx.textAlign = "center";
            ctx.fillText(isConduction ? "ON (CONDUCCIÓN)" : "OFF (BLOQUEO)", dCenter.x, dCenter.y - 28);

            // Resistencia de Carga (780, 400)
            const rPos = { x: 780, y: 400 };
            ctx.fillStyle = "#0c0f17";
            ctx.fillRect(rPos.x - 20, rPos.y - 35, 40, 70);
            ctx.strokeStyle = "#00d0ff";
            ctx.lineWidth = 2.5;
            ctx.strokeRect(rPos.x - 12, rPos.y - 28, 24, 56);
            ctx.font = "12px 'SF Mono', monospace";
            ctx.fillStyle = "#00d0ff";
            ctx.textAlign = "left";
            ctx.fillText(`RL = ${R.toFixed(0)}Ω`, rPos.x + 22, rPos.y + 4);

            // Partículas de corriente
            const particleSpeed = isConduction ? (current / (Vp / R)) * 0.45 : 0;
            
            for (let i = 0; i < particles.length; i++) {
                if (isConduction && !isPaused) {
                    particles[i] = (particles[i] + particleSpeed * dt) % 1.0;
                }
                const pos = getLoopPosition(particles[i]);

                ctx.save();
                ctx.fillStyle = isConduction ? "#ffd000" : "#4a5568";
                if (isConduction) {
                    ctx.shadowColor = "#ffd000";
                    ctx.shadowBlur = 8;
                }
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, isConduction ? 3.5 : 2, 0, 2 * Math.PI);
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
